<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign Interaction</title>
  <style>
/* main_container */
.main_container {
    color: #fff;
    z-index: 1;
    position: relative;
    width: 100%;
    height: 100vh;
}

header {
    padding: 32px;
    display: flex;
    align-items: center;
    width: 50%;
    justify-content: space-between;
    z-index: 2;
    position: relative;
}

.header_menu_button {
    display: flex;
}

.ham_container {
    padding: 16px 0;
}

.hamburger {
    width: 40px;
    height: 3px;
    background-color: #fff;
    position: relative;
    transition: 0.3s;
}

.hamburger.active {
    background-color: transparent;
}

.hamburger::before,
.hamburger::after {
    content: "";
    width: 40px;
    height: 3px;
    background-color: #fff;
    display: block;
    position: absolute;
    left: 0;
    transition: 0.3s;
}

.hamburger::before {
    top: -10px;
}

.hamburger::after {
    top: 10px;
}

.hamburger.active::before {
    transform: rotate(-45deg);
    top: 0;
    background-color: #fff;
}

.hamburger.active::after {
    transform: rotate(45deg);
    top: 0;
    background-color: #fff;
}

.header_menu_button>p {
    font-size: 28px;
    font-weight: 900;
    margin-left: 16px;
}

.wrapper {
    width: 100%;
    height: 100vh;
    background: rgba(0, 0, 0, 0.5);
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
    transition: 0.5s;
}

.wrapper.active {
    opacity: 1;
}

.header_menu {
    position: absolute;
    top: 50%;
    right: 15%;
    transform: translateY(-50%);
}

.header_menu>li {
    line-height: 72px;
    font-size: 40px;
    font-weight: 600;
}

#main_typewriter {
    position: absolute;
    bottom: 10%;
    left: 32px;
    font-size: 48px;
    font-weight: 600;
}

#main_typewriter.hidden {
    opacity: 0;
}

#main_typewriter span {
    color: #ddd;
    transition: color 0.3s ease;
}

#main_typewriter span.active {
    color: #000;
}
  </style>
</head>

<body>
    <section class="main_container">
        <header>
            <h1>
                <img src="./image/logo.svg" alt="로고">
            </h1>
            <div class="header_menu_button">
                <div class="ham_container">
                    <div class="hamburger"></div>
                </div>
                <p>menu</p>
            </div>
        </header>
        <div class="wrapper">
            <ul class="header_menu">
                <li>Hair</li>
                <li>Face</li>
                <li>Hand</li>
                <li>Body</li>
                <li>location</li>
            </ul>
        </div>
        <div class="main_text_content">
            <p id="main_typewriter"></p>
        </div>
    </section>

  <script>
    const text = "We believe in making effective products from fresh, organic fruits and vegetables, the finest essential oils, and safe synthetics. Always handmade, never tested on animals. Lush stands for beauty that's kind to people, animals, and the planet."
const container = document.getElementById("main_typewriter");

text.split('').forEach(char => {
    const span = document.createElement('span');
    span.textContent = char;
    container.appendChild(span);
});

const spans = container.querySelectorAll('span');
const totalLetters = spans.length;

window.addEventListener('scroll', () => {
    const scrollTop = window.scrollY;
    const maxScroll = document.body.scrollHeight - window.innerHeight;
    const scrollRatio = scrollTop / maxScroll;

    const activeCount = Math.floor(scrollRatio * totalLetters);

    spans.forEach((span, index) => {
        if (index <= activeCount) {
            span.classList.add('active');
        }
        else {
            span.classList.remove('active');
        }
    })
})
  </script>

</body>
</html>
