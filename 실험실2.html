
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>Scroll Test</title>
  <style>
    .bestseller_container {
      margin: 64px 0;
    }

    .bestseller_container>h2 {
      text-align: center;
      font-size: 64px;
      font-weight: 900;
      margin-top: 54px;
    }

    .bestseller_container>p {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      margin: 40px;
      color: #443f3f;
    }

    .bestseller_slider_wrapper {
      width: 100%;
      overflow: hidden;
    }

    .bestseller_slider {
      animation: scroll 20s linear infinite;
    }

    @keyframes scroll {
      0% {
        transform: translateX(0%);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .bestseller_content {
      display: flex;
      gap: 32px;
    }

    .bestseller_content>li {
      position: relative;
    }

    .bestseller_content>li>img {
      width: 400px;
      height: 400px;
    }

    .bestseller_overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      border-radius: 50%;
      opacity: 0;
      transition: 0.7s;
    }

    .bestseller_content>li:hover .bestseller_overlay {
      opacity: 1;
    }

    .bestseller_content>li:hover>img {
      transform: scale(1.1);
      transition: 0.7s;
    }
  </style>
</head>

<body>
  <section class="bestseller_container">
    <h2>Bestseller</h2>
    <p>We are changing the world we live in for the better.</p>
    <div class="bestseller_slider_wrapper">
      <div class="bestseller_slider">
        <ul class="bestseller_content">
          <li>
            <img src="./image/best_1.png" alt="">
            <div class="bestseller_overlay">
              Dirty Springwash 샤워젤
            </div>
          </li>
          <li>
            <img src="./image/best_2.png" alt="">
            <div class="bestseller_overlay">
              인터갈락틱 200g - 버블바 / 입욕제
            </div>
          </li>
          <li>
            <img src="./image/best_3.png" alt="">
            <div class="bestseller_overlay">
              American Cream 헤어 컨디셔너
            </div>
          </li>
          <li>
            <img src="./image/best_4.png" alt="">
            <div class="bestseller_overlay">
              마스크 오브 매그너민티
            </div>
          </li>
          <li>
            <img src="./image/best_5.png" alt="">
            <div class="bestseller_overlay">
              더티 스프레이
            </div>
          </li>
        </ul>
      </div>
    </div>
  </section>

</body>

</html>
