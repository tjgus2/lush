<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scroll Typing Effect - 단어 단위, 위로 올릴 땐 색 변화 없음</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
    }

    .main_container {
      height: 100vh;
      background: url('./image/de262e72-3d52-42e3-8d1a-94ead9c96c8b.png') no-repeat center/cover;
      position: relative;
    }

    .scroll_area {
      height: 300vh;
      /* 스크롤 유도용 */
    }

    .sticky_text {
      position: sticky;
      top: 50%;
      transform: translateY(-50%);
      font-size: 48px;
      font-weight: 600;
      line-height: 1.5;
      padding: 0 32px;
      color: #999;
      white-space: pre-wrap;
    }

    .sticky_text span {
      color: #ddd;
      transition: color 0.2s ease;
      cursor: default;
      user-select: none;
    }

    .sticky_text span.active {
      color: #000;
    }
  </style>
</head>

<body>

  <div class="scroll_area">
    <section class="main_container">
      <p class="sticky_text" id="main_typewriter"></p>
    </section>
  </div>

  <script>
    const text = "We believe in making effective products from fresh, organic fruits and vegetables, the finest essential oils, and safe synthetics. Always handmade, never tested on animals. Lush stands for beauty that's kind to people, animals, and the planet.";

    const container = document.getElementById("main_typewriter");

    const words = text.split(/(\s+)/);

    words.forEach(word => {
      const span = document.createElement('span');
      span.textContent = word;
      container.appendChild(span);
    });

    const spans = container.querySelectorAll('span');
    const totalWords = spans.length;

    let lastScrollY = window.scrollY;

    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;

      if (currentScrollY > lastScrollY) { // 스크롤 내릴 때만 활성화 업데이트
        const containerRect = container.getBoundingClientRect();
        const windowHeight = window.innerHeight;

        const scrollY = Math.min(Math.max(0, windowHeight - containerRect.top), windowHeight);
        const scrollRatio = scrollY / windowHeight;

        const activeCount = Math.floor(scrollRatio * totalWords);

        spans.forEach((span, index) => {
          if (index <= activeCount) {
            span.classList.add('active');
          }
        });
      }

      lastScrollY = currentScrollY;
    });
  </script>

</body>

</html>
