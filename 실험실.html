<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
        }

        .fill-text {
            /* 기본 “연필선” 색 */
            color: #bdbdbd;
            font-size: 1.25rem;
            line-height: 1.55;
            white-space: pre-line;
            /* 줄바꿈 유지 */
            margin: 0 5vw;
            position: relative;
            font-size: 60px;
        }

        /* 검정으로 채워질 가상요소 */
        .fill-text::after {
            content: attr(data-text);
            position: absolute;
            top: 93px;

            /* 글자 내부만 배경이 보이도록 */
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            /* 처음에는 폭 0%인 검정 그라디언트 */
            background-image: linear-gradient(90deg, #000 0 0);
            background-repeat: no-repeat;
            background-size: 0% 100%;

            transition: background-size 1.2s ease-out;
        }

        /* 화면에 들어오면 0 → 100 % 로 채우기 */
        .fill-text.revealed::after {
            background-size: 100% 100%;
        }
    </style>
</head>

<body>
    <section style="height:110vh"></section> <!-- 테스트용 여유 스크롤 -->

    <p class="fill-text" data-text="Hanchang’s zeolite molecular sieves are
    the key material of VPSA oxygen generators,
    essential for industries like steel, smelting, glass,
    and medical fields, as well as LiBr absorbents.">
        Hanchang’s zeolite molecular sieves are
        the key material of VPSA oxygen generators,
        essential for industries like steel, smelting, glass,
        and medical fields, as well as LiBr absorbents.
    </p>

    <section style="height:110vh"></section>

    <script>
        const target = document.querySelector('.fill-text');

        const io = new IntersectionObserver(entries => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    target.classList.add('revealed');   // 보이면 색 채우기
                } else {
                    target.classList.remove('revealed'); // 벗어나면 다시 회색
                }
            });
        }, { threshold: 0.6 });  // 60 % 정도 보일 때 트리거

        io.observe(target);


    </script>
</body>


</html>
