<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            height: 400vh;
        }

        .main_container {
            background-color: #a4a2a2;
            color: #fff;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 400px;
        }

        header {
            padding: 32px;
            display: flex;
            align-items: center;
            width: 50%;
            justify-content: space-between;
            z-index: 2;
            position: relative;
        }

        .header_menu_button {
            display: flex;
            align-items: center;
        }

        .ham_container {
            padding: 16px 0;
        }

        .hamburger {
            width: 40px;
            height: 3px;
            background-color: #fff;
            position: relative;
            transition: 0.3s;
        }

        .hamburger.active {
            background-color: transparent;
        }

        .hamburger::before,
        .hamburger::after {
            content: "";
            width: 40px;
            height: 3px;
            background-color: #fff;
            display: block;
            position: absolute;
            left: 0;
            transition: 0.3s;
        }

        .hamburger::before {
            top: -10px;
        }

        .hamburger::after {
            top: 10px;
        }

        .hamburger.active::before {
            transform: rotate(-45deg);
            top: 0;
            background-color: #fff;
        }

        .hamburger.active::after {
            transform: rotate(45deg);
            top: 0;
            background-color: #fff;
        }

        .header_menu_button>p {
            font-size: 28px;
            font-weight: 900;
            margin-left: 16px;
        }

        body.lock-scroll {
            overflow: hidden;
            height: 100%;
            touch-action: none;
        }

        .wrapper {
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: 0.5s;
        }

        .wrapper.active {
            opacity: 1;
        }

        .header_menu {
            position: absolute;
            top: 50%;
            right: 15%;
            transform: translateY(-50%);
        }

        .header_menu>li {
            line-height: 72px;
            font-size: 40px;
            font-weight: 600;
        }

        #main_typewriter {
            font-size: 84px;
            font-weight: 600;
            position: relative;
            padding: 0 16px;
            color: #000;
            box-sizing: border-box;
        }

        #main_typewriter::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            padding: 0 16px;

            width: 100%;
            height: 120%;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            background-image: linear-gradient(90deg, #fff 0 0);

            background-repeat: no-repeat;
            background-size: var(--bg-fill, 0%) 100%;

            pointer-events: none;
        }

        #main_typewriter.revealed::after {
            background-size: 100% 100%;
        }

        #main_typewriter.hidden {
            display: none;
        }
    </style>
</head>

<body>
    <section class="main_container">
        <header>
            <h1>
                <img src="./image/logo.svg" alt="로고">
            </h1>
            <div class="header_menu_button">
                <div class="ham_container">
                    <div class="hamburger"></div>
                </div>
                <p>menu</p>
            </div>
        </header>
        <div class="wrapper">
            <ul class="header_menu">
                <li>Hair</li>
                <li>Face</li>
                <li>Hand</li>
                <li>Body</li>
                <li>location</li>
            </ul>
        </div>
        <div class="main_text_content">
            <p id="main_typewriter"
                data-text="Lush makes effective, handmade products using fresh, organic ingredients, and is always kind to people, and animals.">
                Lush makes effective, handmade products using fresh, organic ingredients, and is always kind to people,
                and animals.
            </p>
        </div>
    </section>

    <script>
        const target = document.getElementById("main_typewriter");

        window.addEventListener("scroll", () => {
            const rect = target.getBoundingClientRect();
            const windowHeight = window.innerHeight;

            // 요소가 화면에 얼마나 보였는지 계산
            let progress = (windowHeight - rect.top) / (rect.height + windowHeight);

            // 0 ~ 1 사이로 고정
            progress = Math.min(Math.max(progress, 0), 1);

            // 채워지는 퍼센트
            const percent = progress * 100;

            target.style.setProperty("--bg-fill", `${percent}%`);
        });

    </script>
</body>

</html>
