<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eye Blink</title>
  <style>
    body {
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>

<svg width="200" height="200" viewBox="0 0 200 200">
  <!-- 눈 모양 (테두리) -->
  <path d="M 20 100 Q 100 20 180 100 Q 100 180 20 100 Z" fill="white" stroke="black" stroke-width="4"/>
  
  <!-- 눈동자 -->
  <circle cx="100" cy="100" r="20" fill="black" />

  <!-- 눈꺼풀 -->
  <path id="eyelid" d="M 20 100 Q 100 100 180 100 Q 100 100 20 100 Z" fill="white">
    <animate 
      attributeName="d" 
      dur="2s" 
      repeatCount="indefinite"
      values="
        M 20 100 Q 100 100 180 100 Q 100 100 20 100 Z; 
        M 20 100 Q 100 20 180 100 Q 100 180 20 100 Z; 
        M 20 100 Q 100 100 180 100 Q 100 100 20 100 Z
      "
    />
  </path>
</svg>

</body>
</html>
