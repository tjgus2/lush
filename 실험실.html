<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Scroll Text Color Change</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    min-height: 100%;
    background: #fff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
  }
  .main_container {
    position: relative;
    height: 100vh;
    width: 100%;
    background: #fff;
    /* overflow: hidden;  이걸 제거합니다 */
  }
  #main_typewriter {
    position: absolute;
    bottom: 5%;
    left: 32px;
    right: 32px;
    font-size: 32px;
    font-weight: 600;
    text-align: center;
    user-select: none;
    line-height: 1.4;
  }
  #main_typewriter span {
    color: #ddd;
    transition: color 0.3s ease;
  }
  #main_typewriter span.active {
    color: #000;
  }
  #scroll_area {
    height: 150vh;
    background: #fff;
  }
</style>
</head>
<body>
  <section class="main_container">
    <p id="main_typewriter"></p>
  </section>
  <section id="scroll_area"></section>

  <script>
    const text = "We believe in making effective products from fresh, organic fruits and vegetables, the finest essential oils, and safe synthetics. Always handmade, never tested on animals. Lush stands for beauty that's kind to people, animals, and the planet.";
    const container = document.getElementById("main_typewriter");
    text.split('').forEach(char => {
      const span = document.createElement('span');
      span.textContent = char;
      container.appendChild(span);
    });

    const spans = container.querySelectorAll('span');
    const totalLetters = spans.length;

    window.addEventListener('scroll', () => {
      console.log(window.scrollY); // 위치 체크용

      const scrollTop = window.scrollY;
      const maxScroll = document.body.scrollHeight - window.innerHeight;
      let scrollRatio = scrollTop / maxScroll;
      if (scrollRatio > 1) scrollRatio = 1;
      if (scrollRatio < 0) scrollRatio = 0;
      const activeCount = Math.floor(scrollRatio * totalLetters);

      spans.forEach((span, idx) => {
        if (idx <= activeCount) {
          span.classList.add('active');
        } else {
          span.classList.remove('active');
        }
      });
    });
  </script>
</body>
</html>
