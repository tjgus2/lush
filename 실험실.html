<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campaign Scroll Typing</title>
  <style>
    .main_container {
      color: #fff;
      z-index: 1;
      width: 100%;
      height: 400vh;
      display: flex;
      flex-direction: column;
      gap: 400px;
    }

    header {
      padding: 32px;
      display: flex;
      align-items: center;
      width: 50%;
      justify-content: space-between;
      z-index: 2;
      position: relative;
    }

    .header_menu_button {
      display: flex;
      align-items: center;
    }

    .ham_container {
      padding: 16px 0;
    }

    .hamburger {
      width: 40px;
      height: 3px;
      background-color: #fff;
      position: relative;
      transition: 0.3s;
    }

    .hamburger.active {
      background-color: transparent;
    }

    .hamburger::before,
    .hamburger::after {
      content: "";
      width: 40px;
      height: 3px;
      background-color: #fff;
      display: block;
      position: absolute;
      left: 0;
      transition: 0.3s;
    }

    .hamburger::before {
      top: -10px;
    }

    .hamburger::after {
      top: 10px;
    }

    .hamburger.active::before {
      transform: rotate(-45deg);
      top: 0;
      background-color: #fff;
    }

    .hamburger.active::after {
      transform: rotate(45deg);
      top: 0;
      background-color: #fff;
    }

    .header_menu_button>p {
      font-size: 28px;
      font-weight: 900;
      margin-left: 16px;
    }

    .wrapper {
      width: 100%;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: 0.5s;
    }

    .wrapper.active {
      opacity: 1;
    }

    .header_menu {
      position: absolute;
      top: 50%;
      right: 15%;
      transform: translateY(-50%);
    }

    .header_menu>li {
      line-height: 72px;
      font-size: 40px;
      font-weight: 600;
    }

    #main_typewriter {
      font-size: 84px;
      font-weight: 600;
      padding: 32px;
      position: sticky;
      text-align: center;
    }

    #main_typewriter.hidden {
      opacity: 0;
    }

    #main_typewriter span {
      color: #7e7878;
      transition: color 0.3s ease;
    }

    #main_typewriter span.active {
      color: #000;
    }
  </style>
</head>

<body>
  <section class="main_container">
    <header>
      <h1>
        <img src="./image/logo.svg" alt="로고">
      </h1>
      <div class="header_menu_button">
        <div class="ham_container">
          <div class="hamburger"></div>
        </div>
        <p>menu</p>
      </div>
    </header>
    <div class="wrapper">
      <ul class="header_menu">
        <li>Hair</li>
        <li>Face</li>
        <li>Hand</li>
        <li>Body</li>
        <li>location</li>
      </ul>
    </div>
    <div class="main_text_content">
      <p id="main_typewriter"></p>
    </div>
  </section>

  <script>
    const text = "Lush makes effective, handmade products using fresh, organic ingredients, and is always kind to people, and animals."

    const container = document.getElementById("main_typewriter");

    const words = text.split(/(\s+)/);

    words.forEach(word => {
      const span = document.createElement('span');
      span.textContent = word;
      container.appendChild(span);
    });

    const spans = container.querySelectorAll('span');
    const totalWords = spans.length;

    let lastScrollY = window.scrollY;

    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;

      if (currentScrollY > lastScrollY) { // 스크롤 내릴 때만 활성화 업데이트
        const containerRect = container.getBoundingClientRect();
        const windowHeight = window.innerHeight;

        const scrollY = Math.min(Math.max(0, windowHeight - containerRect.top), windowHeight);
        const scrollRatio = scrollY / windowHeight;

        const activeCount = Math.floor(scrollRatio * totalWords);

        spans.forEach((span, index) => {
          if (index <= activeCount) {
            span.classList.add('active');
          }
        });
      }

      lastScrollY = currentScrollY;
    });
    </script>
</body>
</html>
