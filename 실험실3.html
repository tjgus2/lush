<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign Scroll Typing</title>
    <style>
        body {
            height: 10000px;
        }

        .main_container {
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            position: relative;
            flex-direction: column;
            overflow: hidden;
            background-color: #000;
        }


        header {
            padding: 32px;
            display: flex;
            align-items: center;
            width: 50%;
            justify-content: space-between;
            z-index: 2;
            position: relative;
        }

        .header_menu_button {
            display: flex;
            align-items: center;
        }

        .ham_container {
            padding: 16px 0;
        }

        .hamburger {
            width: 40px;
            height: 3px;
            background-color: #fff;
            position: relative;
            transition: 0.3s;
        }

        .hamburger.active {
            background-color: transparent;
        }

        .hamburger::before,
        .hamburger::after {
            content: "";
            width: 40px;
            height: 3px;
            background-color: #fff;
            display: block;
            position: absolute;
            left: 0;
            transition: 0.3s;
        }

        .hamburger::before {
            top: -10px;
        }

        .hamburger::after {
            top: 10px;
        }

        .hamburger.active::before {
            transform: rotate(-45deg);
            top: 0;
            background-color: #fff;
        }

        .hamburger.active::after {
            transform: rotate(45deg);
            top: 0;
            background-color: #fff;
        }

        .header_menu_button>p {
            font-size: 28px;
            font-weight: 900;
            margin-left: 16px;
        }

        .wrapper {
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: 0.5s;
        }

        .wrapper.active {
            opacity: 1;
        }

        .header_menu {
            position: absolute;
            top: 50%;
            right: 15%;
            transform: translateY(-50%);
        }

        .header_menu>li {
            line-height: 72px;
            font-size: 40px;
            font-weight: 600;
        }

        #main_typewriter {
            position: relative;
            font-size: 90px;
            font-weight: 600;
            /* padding: 32px; */
            text-align: center;
            color: #bdbdbd;
        }

        #main_typewriter::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            /* padding: 32px; */
            width: 100%;
            height: 100%;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            background-image: linear-gradient(90deg, #00d6fc 0 0);
            /* 원하는 색상 */
            background-repeat: no-repeat;
            background-size: var(--bg-fill, 0%) 100%;
            /* JS로 제어 */
            pointer-events: none;
        }

        #main_typewriter.revealed::after {
            background-size: 100% 100%;
        }
    </style>
</head>

<body>
    <section class="main_container">
        <header>
            <h1>
                <img src="./image/logo.svg" alt="로고">
            </h1>
            <div class="header_menu_button">
                <div class="ham_container">
                    <div class="hamburger"></div>
                </div>
                <p>menu</p>
            </div>
        </header>
        <div class="wrapper">
            <ul class="header_menu">
                <li>Hair</li>
                <li>Face</li>
                <li>Hand</li>
                <li>Body</li>
                <li>location</li>
            </ul>
        </div>
        <div class="main_text_content">
            <p id="main_typewriter"
                data-text="Lush makes effective, handmade products using fresh, organic ingredients, and is always kind to people, and animals.">
                Lush makes effective, handmade products using fresh, organic ingredients, and is always kind to people,
                and animals.
            </p>
        </div>
    </section>
    <script>
        const target = document.getElementById("main_typewriter");
        const mainContainer = document.querySelector(".main_container");

        window.addEventListener("scroll", () => {
            const sectionTop = mainContainer.offsetTop;
            const sectionHeight = mainContainer.offsetHeight;
            const scrollY = window.scrollY;

            // 현재 메인 섹션 내에서의 스크롤 거리
            const distanceScrolled = scrollY - sectionTop;

            // 메인 섹션 내 스크롤 비율 (0 ~ 1 사이)
            const scrollRatio = Math.min(Math.max(distanceScrolled / sectionHeight, 0), 1);

            const acceleratedRatio = Math.min(scrollRatio * 2.0, 1);

            // 백분율 계산 후 CSS 변수로 적용
            const percent = acceleratedRatio * 100;
            target.style.setProperty('--bg-fill', `${percent}%`);
        });
    </script>


</body>

</html>
